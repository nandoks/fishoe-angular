<section class="container my-4">
  <div id="title" class="col-12 col-md-8 col-lg-9 mb-3 py-2">
    <h2>Edit Species </h2>
  </div>
  <div class="row g-3 px-3 bg-white">
    @if (specie) {
      <div id="detail" class="col-12 col-lg-6 mx-1">
        <h3>Details:</h3>
        <hr>
        <form class="py-2" action="">
          <div>
            <p class="my-2">Scientific Name</p>
            <input
              type="text"
              name="scientifName"
              class="form-control"
              value="{{ specie.scientificName }}"
            />
            <p class="my-2">Common Name</p>
            <input
              type="text"
              name="scientifName"
              class="form-control"
              value="{{ specie.commonName }}"
            />
            <p class="my-2">Family</p>
            <select
              name="familySelector"
              id="familySelector"
              class="form-select my-2"
              [(ngModel)]="specie.family"
            >
              <option *ngFor="let family of families" [value]="family">
                {{ family }}
              </option>
            </select>
            <p class="my-2">Genus</p>
            <select
              name="genusSelector"
              id="genusSelector"
              class="form-select my-2"
              [(ngModel)]="specie.genus"
            >
              <option *ngFor="let genus of genusList" [value]="genus">
                {{ genus }}
              </option>
            </select>
            <p class="my-2">Status</p>
            <select
              name="statusSelector"
              id="statusSelector"
              class="form-select my-2"
              [(ngModel)]="specie.status"
            >
              <option *ngFor="let status of statusList" [value]="status">
                {{ status }}
              </option>
            </select>
          </div>
          <hr />
          <div id="imageEdit">
            <p>Image URL</p>
            <input
              class="form-control"
              type="text"
              value="https://dummyimage.com/180x180/cccccc/ffffff&text=Doctorfish"
            />
            <img
              class="img-fluid m-3"
              src="https://dummyimage.com/180x180/cccccc/ffffff&text=Doctorfish"
              alt=""
            />
          </div>
          <div class="d-flex flex-wrap gap-2 justify-content-end">
            <button class="btn btn-success">Save</button>
            <a routerLink="/" class="btn btn-danger">Cancel</a>
          </div>
        </form>
      </div>
      <div class="col-12 col-lg-5 mx-3">
        <h3>Coordinates:</h3>
        <hr>
        <div id="coodinateEdit">
          <div class="my-3">
              <app-coordinates-list [coordinates]="specie.coordinates"></app-coordinates-list>
          </div>
          <hr />
          <div class="my-3">
            <app-coordinate-form></app-coordinate-form>
          </div>
          <hr />
          <div class="my-3">
            <app-coordinate-map></app-coordinate-map>
          </div>
        </div>
      </div>
    }
  </div>
</section>
