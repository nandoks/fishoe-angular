<div>
  <p>Add a new coordinate:</p>
  <div class="d-flex flex-column flex-sm-row gap-2">
    <input
      class="form-control flex-grow-1"
      type="text"
      name="latitude"
      id="coordinateLatitude"
      placeholder="latitude"
    />
    <input
      class="form-control flex-grow-1"
      type="text"
      name="longitude"
      id="coordinateLongitude"
      placeholder="longitude"
    />
    <button class="btn btn-success flex-grow-1 flex-sm-grow-0">
      Add coordinate
    </button>
  </div>
</div>
